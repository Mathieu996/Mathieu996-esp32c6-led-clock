name: Build firmware

on:
  push: # branches et tags (un tag "v*" declenche aussi la publication)
  pull_request:
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-c3-supermini, esp32-c6-devkitc-1]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Installer PlatformIO
        run: pip install platformio

      - name: Compiler
        run: pio run -e ${{ matrix.env }}

      # firmware.factory.bin = bootloader + partitions + boot_app0 + firmware,
      # genere par PlatformIO : a ecrire a l'offset 0x0 (outil de flash dans le
      # navigateur, ou "esptool write-flash 0x0 firmware.factory.bin").
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.factory.bin
            .pio/build/${{ matrix.env }}/firmware.bin

  # Publie une release GitHub quand on pousse un tag "vX.Y.Z"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # necessaire pour creer la release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Creer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp artefacts/firmware-esp32-c3-supermini/firmware.factory.bin horloge-led-esp32-c3-supermini.bin
          cp artefacts/firmware-esp32-c6-devkitc-1/firmware.factory.bin horloge-led-esp32-c6.bin
          cat > notes.md <<'EOF'
          ## Telechargement

          Choisissez le fichier correspondant a votre carte, a ecrire a l'adresse **0x0** :

          | Carte | Fichier |
          |---|---|
          | ESP32-C3 SuperMini | `horloge-led-esp32-c3-supermini.bin` |
          | ESP32-C6-DEV-KIT-N8 | `horloge-led-esp32-c6.bin` |

          Avec `esptool` (Python) :

          ```
          python -m esptool --chip esp32c3 write-flash 0x0 horloge-led-esp32-c3-supermini.bin
          python -m esptool --chip esp32c6 write-flash 0x0 horloge-led-esp32-c6.bin
          ```

          Ou dans le navigateur avec https://espressif.github.io/esptool-js/ (adresse 0x0).
          Si le port n'apparait pas, maintenez le bouton BOOT en branchant la carte.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            horloge-led-esp32-c3-supermini.bin \
            horloge-led-esp32-c6.bin
