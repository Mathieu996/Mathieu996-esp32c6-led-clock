; Horloge LED ESP32-C6 + 4x matrice 8x8 (MAX7219 / 1288BB)
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
; Le platform officiel "espressif32" de PlatformIO ne déclare pas le framework
; Arduino pour les cartes ESP32-C6 (uniquement espidf), même si le package
; Arduino est bien installé. On utilise donc le fork pioarduino, qui maintient
; activement le support Arduino pour l'ESP32-C6/C5/H2/P4.
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    majicdesigns/MD_Parola@^3.7.3
    majicdesigns/MD_MAX72XX@^3.5.1
    bblanchon/ArduinoJson@^7.2.1
