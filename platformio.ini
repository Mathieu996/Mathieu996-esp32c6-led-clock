; Horloge LED ESP32-C6 / ESP32-C3 + 4x matrice 8x8 (MAX7219 / 1288BB)
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Carte actuellement utilisee (sinon "pio run" compile/televerse tous les envs)
default_envs = esp32-c3-supermini

; Reglages communs aux deux cartes
[env]
; Le platform officiel "espressif32" de PlatformIO ne déclare pas le framework
; Arduino pour les cartes ESP32-C6 (uniquement espidf), même si le package
; Arduino est bien installé. On utilise donc le fork pioarduino, qui maintient
; activement le support Arduino pour l'ESP32-C6/C5/H2/P4 (et le C3).
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    majicdesigns/MD_Parola@^3.7.3
    majicdesigns/MD_MAX72XX@^3.5.1
    bblanchon/ArduinoJson@^7.2.1

[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1

[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
; Le SuperMini n'a pas de puce USB-serie : Serial passe par l'USB natif
; (CDC), a activer explicitement sinon le moniteur reste vide.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
